[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investigation"
version = "0.1.1"
description = "Windows incident response: live evidence collection, super-timeline analysis and ATT&CK-mapped reporting"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Baran Aktaş" }]
keywords = ["dfir", "incident-response", "forensics", "windows", "timeline", "sigma", "yara", "mitre-attack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Recovery Tools",
]
dependencies = [
    "dissect.eventlog>=3.11",
    "pyyaml>=6",
    "jinja2>=3.1",
    "dissect.target>=3.20",
    "dissect.shellitem>=3",
    "dissect.cim>=3",
    "dissect.thumbcache>=1",
    "dissect.ole>=3",
    "dissect.executable>=1",
    "dissect.fat>=3",
    "dissect.fve>=4.5",
    "dissect.archive>=1",
    "pycryptodome>=3",
    "pysigma>=1.0",
    "yara-python>=4.3",
    "volatility3>=2.7",
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/baranaktas/dfir_investigation"
Issues = "https://github.com/baranaktas/dfir_investigation/issues"
Changelog = "https://github.com/baranaktas/dfir_investigation/blob/main/CHANGELOG.md"

[project.scripts]
investigation = "investigation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["investigation"]
artifacts = ["investigation/profiles/*.yaml", "investigation/rules/**/*.yaml", "investigation/templates/*", "investigation/artifacts/*.yaml", "investigation/resources/winpmem/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
